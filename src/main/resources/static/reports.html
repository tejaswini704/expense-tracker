<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports - Expense Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #333;
        }

        header {
            background: #6c63ff;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 15px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav button {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            color: #6c63ff;
            font-weight: bold;
        }

        nav button:hover {
            background: #eee;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .filter-card,
        .chart-card,
        .records-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .filter-card h2,
        .chart-card h2,
        .records-card h2 {
            margin-bottom: 20px;
        }

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-group label {
            font-weight: bold;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .clear-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            background: #555;
            color: white;
            cursor: pointer;
        }

        .clear-btn:hover {
            background: #333;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .summary-card h3 {
            color: #777;
            margin-bottom: 10px;
        }

        .summary-card p {
            font-size: 28px;
            font-weight: bold;
            color: #6c63ff;
        }

        .chart-container {
            position: relative;
            height: 350px;
        }

        .bottom-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            background: #f5f7fb;
            border-radius: 8px;
        }

        .category-name {
            font-weight: bold;
        }

        .category-amount {
            font-weight: bold;
            color: #6c63ff;
        }

        .message {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        /* RECORD TABLE */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f5f7fb;
            font-weight: bold;
        }

        tr:hover {
            background: #fafafa;
        }

        .amount {
            font-weight: bold;
            color: #6c63ff;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 5px;
        }

        .edit-btn {
            background: #6c63ff;
            color: white;
        }

        .edit-btn:hover {
            background: #574fd6;
        }

        .delete-btn {
            background: #ff4d4d;
            color: white;
        }

        .delete-btn:hover {
            background: #d93636;
        }

        @media (max-width: 700px) {

            .summary {
                grid-template-columns: 1fr;
            }

            .bottom-section {
                grid-template-columns: 1fr;
            }

            th,
            td {
                font-size: 14px;
                padding: 10px 8px;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>📊 Expense Reports</h1>

        <nav>
            <button onclick="goTo('index.html')">🏠 Home</button>
            <button onclick="goTo('add.html')">➕ Add Expense</button>
            <button onclick="goTo('expenses.html')">📋 Expenses</button>
            <button onclick="goTo('reports.html')">📊 Reports</button>
        </nav>

    </header>

    <div class="container">

        <!-- FILTER -->

        <div class="filter-card">

            <h2>🔎 Filter Reports</h2>

            <div class="filters">

                <div class="filter-group">

                    <label for="reportDate">
                        Select Date
                    </label>

                    <input type="date" id="reportDate">

                </div>

                <button class="clear-btn" onclick="clearFilter()">
                    Clear Filter
                </button>

            </div>

        </div>


        <!-- SUMMARY -->

        <div class="summary">

            <div class="summary-card">

                <h3>💰 Total Spent</h3>

                <p id="totalSpent">
                    ₹0.00
                </p>

            </div>


            <div class="summary-card">

                <h3>🧾 Number of Expenses</h3>

                <p id="expenseCount">
                    0
                </p>

            </div>


            <div class="summary-card">

                <h3>📈 Average Expense</h3>

                <p id="averageExpense">
                    ₹0.00
                </p>

            </div>

        </div>


        <!-- EXPENSE RECORDS -->

        <div class="records-card">

            <h2>📋 Expense Records</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Title</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="expenseTableBody">

                        <tr>
                            <td colspan="5" class="message">
                                Loading...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- DAILY CHART -->

        <div class="chart-card">

            <h2>📅 Daily Spending</h2>

            <div class="chart-container">

                <canvas id="dailyChart"></canvas>

            </div>

        </div>


        <!-- CATEGORY SECTION -->

        <div class="bottom-section">

            <!-- CATEGORY CHART -->

            <div class="chart-card">

                <h2>🍩 Spending by Category</h2>

                <div class="chart-container">

                    <canvas id="categoryChart"></canvas>

                </div>

            </div>


            <!-- CATEGORY LIST -->

            <div class="chart-card">

                <h2>📋 Category Breakdown</h2>

                <div id="categoryList" class="category-list">

                    <div class="message">
                        Loading...
                    </div>

                </div>

            </div>

        </div>

    </div>


    <script>

        const API_URL = "/api/expenses";

        let allExpenses = [];

        let dailyChart = null;
        let categoryChart = null;


        // -------------------------------
        // NAVIGATION
        // -------------------------------

        function goTo(page) {

            window.location.href = page;

        }


        // -------------------------------
        // LOAD EXPENSES
        // -------------------------------

        async function loadReports() {

            try {

                const response = await fetch(API_URL);

                if (!response.ok) {

                    throw new Error("Failed to load expenses");

                }

                allExpenses = await response.json();

                updateReports();

            } catch (error) {

                console.error(error);

                document.getElementById("expenseTableBody").innerHTML =
                    '<tr><td colspan="5" class="message">❌ Could not load expenses. Make sure Spring Boot is running.</td></tr>';

                document.getElementById("categoryList").innerHTML =
                    '<div class="message">❌ Could not load expenses.</div>';

            }

        }


        // -------------------------------
        // UPDATE EVERYTHING
        // -------------------------------

        function updateReports() {

            const selectedDate =
                document.getElementById("reportDate").value;

            let filtered = [...allExpenses];


            // DATE FILTER

            if (selectedDate !== "") {

                filtered = filtered.filter(expense => {

                    return expense.date === selectedDate;

                });

            }


            updateSummary(filtered);

            updateExpenseTable(filtered);

            updateDailyChart(filtered);

            updateCategoryChart(filtered);

            updateCategoryList(filtered);

        }


        // -------------------------------
        // SUMMARY
        // -------------------------------

        function updateSummary(expenses) {

            const total = expenses.reduce(

                (sum, expense) =>

                    sum + Number(expense.amount || 0),

                0

            );


            const count = expenses.length;


            const average =
                count > 0 ? total / count : 0;


            document.getElementById("totalSpent").textContent =
                "₹" + total.toFixed(2);


            document.getElementById("expenseCount").textContent =
                count;


            document.getElementById("averageExpense").textContent =
                "₹" + average.toFixed(2);

        }


        // -------------------------------
        // EXPENSE TABLE
        // -------------------------------

        function updateExpenseTable(expenses) {

            const tableBody =
                document.getElementById("expenseTableBody");


            if (expenses.length === 0) {

                tableBody.innerHTML =
                    '<tr><td colspan="5" class="message">No expenses found for this date.</td></tr>';

                return;

            }


            tableBody.innerHTML = expenses.map(expense => {

                const category =
                    expense.category?.name ||
                    expense.category ||
                    "Other";


                return `

                    <tr>

                        <td>
                            ${escapeHtml(expense.title || "Untitled")}
                        </td>

                        <td class="amount">
                            ₹${Number(expense.amount || 0).toFixed(2)}
                        </td>

                        <td>
                            ${expense.date || "-"}
                        </td>

                        <td>
                            ${getCategoryIcon(category)}
                            ${escapeHtml(category)}
                        </td>

                        <td>

                            <button
                                class="edit-btn"
                                onclick="editExpense(${expense.id})">
                                ✏️ Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteExpense(${expense.id})">
                                🗑️ Delete
                            </button>

                        </td>

                    </tr>

                `;

            }).join("");

        }


        // -------------------------------
        // EDIT EXPENSE
        // -------------------------------

        function editExpense(id) {

            window.location.href =
                "add.html?id=" + id;

        }


        // -------------------------------
        // DELETE EXPENSE
        // -------------------------------

        async function deleteExpense(id) {

            const confirmed =
                confirm("Are you sure you want to delete this expense?");


            if (!confirmed) {

                return;

            }


            try {

                const response =
                    await fetch(API_URL + "/" + id, {

                        method: "DELETE"

                    });


                if (!response.ok) {

                    throw new Error("Delete failed");

                }


                alert("Expense deleted successfully!");


                await loadReports();

            } catch (error) {

                console.error(error);

                alert(
                    "❌ Could not delete the expense."
                );

            }

        }


        // -------------------------------
        // DAILY CHART
        // -------------------------------

        function updateDailyChart(expenses) {

            const dailyTotals = {};


            expenses.forEach(expense => {

                const date =
                    expense.date || "Unknown";


                if (!dailyTotals[date]) {

                    dailyTotals[date] = 0;

                }


                dailyTotals[date] +=
                    Number(expense.amount || 0);

            });


            const dates =
                Object.keys(dailyTotals).sort();


            const amounts =
                dates.map(date =>
                    dailyTotals[date]
                );


            const ctx =
                document.getElementById("dailyChart");


            if (dailyChart) {

                dailyChart.destroy();

            }


            dailyChart = new Chart(ctx, {

                type: "line",

                data: {

                    labels: dates,

                    datasets: [{

                        label: "Daily Spending (₹)",

                        data: amounts,

                        borderWidth: 2,

                        tension: 0.3,

                        fill: false

                    }]

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    scales: {

                        y: {

                            beginAtZero: true

                        }

                    }

                }

            });

        }


        // -------------------------------
        // CATEGORY CHART
        // -------------------------------

        function updateCategoryChart(expenses) {

            const categoryTotals = {};


            expenses.forEach(expense => {

                const category =
                    expense.category?.name ||
                    expense.category ||
                    "Other";


                if (!categoryTotals[category]) {

                    categoryTotals[category] = 0;

                }


                categoryTotals[category] +=
                    Number(expense.amount || 0);

            });


            const categories =
                Object.keys(categoryTotals);


            const amounts =
                categories.map(category =>
                    categoryTotals[category]
                );


            const ctx =
                document.getElementById("categoryChart");


            if (categoryChart) {

                categoryChart.destroy();

            }


            categoryChart = new Chart(ctx, {

                type: "doughnut",

                data: {

                    labels: categories,

                    datasets: [{

                        data: amounts

                    }]

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    plugins: {

                        legend: {

                            position: "bottom"

                        }

                    }

                }

            });

        }


        // -------------------------------
        // CATEGORY LIST
        // -------------------------------

        function updateCategoryList(expenses) {

            const categoryTotals = {};


            expenses.forEach(expense => {

                const category =
                    expense.category?.name ||
                    expense.category ||
                    "Other";


                if (!categoryTotals[category]) {

                    categoryTotals[category] = 0;

                }


                categoryTotals[category] +=
                    Number(expense.amount || 0);

            });


            const categories =
                Object.entries(categoryTotals)
                    .sort((a, b) => b[1] - a[1]);


            const list =
                document.getElementById("categoryList");


            if (categories.length === 0) {

                list.innerHTML =
                    '<div class="message">No expenses found for this date.</div>';

                return;

            }


            list.innerHTML =

                categories.map(([category, amount]) => {

                    return `

                        <div class="category-item">

                            <span class="category-name">

                                ${getCategoryIcon(category)}

                                ${escapeHtml(category)}

                            </span>

                            <span class="category-amount">

                                ₹${amount.toFixed(2)}

                            </span>

                        </div>

                    `;

                }).join("");

        }


        // -------------------------------
        // CATEGORY ICON
        // -------------------------------

        function getCategoryIcon(category) {

            const icons = {

                Food: "🍔",

                Bills: "🧾",

                Travel: "🚗",

                Shopping: "🛍️",

                Skincare: "🧴",

                Stationery: "📚",

                Other: "📦"

            };


            return icons[category] || "📦";

        }


        // -------------------------------
        // SAFE HTML
        // -------------------------------

        function escapeHtml(value) {

            return String(value)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }


        // -------------------------------
        // CLEAR FILTER
        // -------------------------------

        function clearFilter() {

            document.getElementById("reportDate").value = "";

            updateReports();

        }


        // -------------------------------
        // DATE FILTER EVENT
        // -------------------------------

        document
            .getElementById("reportDate")
            .addEventListener("change", function () {

                updateReports();

            });


        // -------------------------------
        // START
        // -------------------------------

        loadReports();

    </script>

</body>

</html>
