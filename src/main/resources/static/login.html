<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .switch {
            text-align: center;
            margin-top: 18px;
            color: #555;
        }

        .switch span {
            color: #4f46e5;
            cursor: pointer;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>💰 Expense Tracker</h1>
        <p class="subtitle" id="formTitle">Login to your account</p>

        <input type="text" id="username" placeholder="Username">

        <input type="password" id="password" placeholder="Password">

        <button onclick="submitForm()" id="submitButton">
            Login
        </button>

        <div class="switch">
            <span id="switchText">Don't have an account?</span>
            <span onclick="toggleForm()" id="switchButton">Create Account</span>
        </div>

        <div class="message" id="message"></div>

    </div>

    <script>

        let isRegister = false;

        function toggleForm() {

            isRegister = !isRegister;

            if (isRegister) {
                document.getElementById("formTitle").textContent =
                    "Create your account";

                document.getElementById("submitButton").textContent =
                    "Create Account";

                document.getElementById("switchText").textContent =
                    "Already have an account?";

                document.getElementById("switchButton").textContent =
                    "Login";

            } else {

                document.getElementById("formTitle").textContent =
                    "Login to your account";

                document.getElementById("submitButton").textContent =
                    "Login";

                document.getElementById("switchText").textContent =
                    "Don't have an account?";

                document.getElementById("switchButton").textContent =
                    "Create Account";
            }

            document.getElementById("message").textContent = "";
        }


        async function submitForm() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            if (!username || !password) {

                message.textContent =
                    "Please enter username and password.";

                return;
            }

            const endpoint = isRegister
                ? "/api/users/register"
                : "/api/users/login";

            try {

                const response = await fetch(endpoint, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const result = await response.json().catch(() => null);

                if (!response.ok) {

                    message.textContent =
                        typeof result === "string"
                            ? result
                            : "Invalid username or password.";

                    return;
                }

                localStorage.setItem(
                    "loggedInUser",
                    JSON.stringify(result)
                );

                window.location.href = "index.html";

            } catch (error) {

                message.textContent =
                    "Unable to connect to server.";

                console.error(error);
            }
        }

    </script>

</body>

</html>
