# ========================================================
# Development Profile (H2 In-Memory / Local File Database)
# Use this profile if MySQL is not yet installed or running:
# Run command: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
# ========================================================
spring.datasource.url=jdbc:h2:file:./data/expensetracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
